<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./image-slot.js"></script>
<style>
  body { margin: 0; }
  @media (min-width: 480px) {
    .app-shell { max-width: 400px !important; box-shadow: 0 4px 24px rgba(20,20,43,0.08) !important; margin: 24px auto !important; min-height: auto !important; border-radius: 24px !important; }
  }
</style>
</helmet>
<div dir="rtl" class="app-shell" style="min-height:100vh;background:oklch(0.955 0.004 260);font-family:'Google Sans','Segoe UI',Arial,'Noto Sans Hebrew',sans-serif;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">

  <!-- Calendar card -->
  <div style="background:#fff;border-radius:16px;padding:14px 16px 8px;box-shadow:0 1px 3px rgba(20,20,43,0.06)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:22px;height:22px;border-radius:5px;background:#fff;border:1px solid oklch(0.85 0.01 260);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="oklch(0.5 0.15 255)" stroke-width="2"/><path d="M3 9H21" stroke="oklch(0.5 0.15 255)" stroke-width="2"/><path d="M8 3V6M16 3V6" stroke="oklch(0.5 0.15 255)" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span style="font-size:13px;font-weight:600;color:oklch(0.25 0.01 260)">יומן Google <span style="font-weight:400;color:oklch(0.6 0.01 260)">- לא זמינים</span></span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:oklch(0.4 0.01 260);font-weight:500">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="oklch(0.5 0.01 260)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>יולי 2026</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="oklch(0.5 0.01 260)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:10px">
      <sc-for list="{{ weekDays }}" as="d" hint-placeholder-count="7">
        <div style="text-align:center;font-size:11px;color:oklch(0.6 0.01 260);padding-bottom:6px">{{ d.label }}</div>
      </sc-for>
      <sc-for list="{{ weekDays }}" as="d" hint-placeholder-count="7">
        <div style="display:flex;align-items:center;justify-content:center">
          <span style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:{{ d.today }};color:{{ d.color }};font-weight:{{ d.weight }}">{{ d.date }}</span>
        </div>
      </sc-for>
    </div>

    <div style="display:flex;flex-direction:column;border-top:1px solid oklch(0.93 0.003 260)">
      <sc-for list="{{ events }}" as="ev" hint-placeholder-count="3">
        <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 2px;border-bottom:1px solid oklch(0.95 0.003 260)">
          <span style="width:8px;height:8px;border-radius:50%;background:{{ ev.color }};margin-top:6px;flex-shrink:0"></span>
          <div style="display:flex;flex-direction:column;gap:2px;flex:1">
            <div style="display:flex;align-items:baseline;justify-content:space-between">
              <span style="font-size:13.5px;font-weight:600;color:oklch(0.25 0.01 260)">{{ ev.title }}</span>
              <span style="font-size:12px;color:oklch(0.5 0.01 260)">{{ ev.start }} - {{ ev.end }}</span>
            </div>
            <div style="display:flex;align-items:center;gap:4px">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 21C12 21 19 15 19 10C19 6.13 15.87 3 12 3C8.13 3 5 6.13 5 10C5 15 12 21 12 21Z" stroke="oklch(0.6 0.01 260)" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.3" stroke="oklch(0.6 0.01 260)" stroke-width="2"/></svg>
              <span style="font-size:12px;color:oklch(0.55 0.01 260)">{{ ev.location }}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <a href="#" style="display:block;text-align:center;padding:10px 0 4px;font-size:13px;color:oklch(0.5 0.15 255);text-decoration:none;font-weight:600">פתח ביומן</a>
  </div>

  <!-- Gradient pill buttons -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <a href="#" style="text-decoration:none;position:relative;background:linear-gradient(135deg, oklch(0.5 0.16 255), oklch(0.4 0.17 260));border-radius:26px;padding:12px 34px;display:flex;align-items:center;justify-content:center;color:#fff">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="position:absolute;right:14px;top:50%;transform:translateY(-50%)"><path d="M9 5L15 12L9 19" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="display:flex;align-items:center;gap:8px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><path d="M3 16V12L5 8H16L19 12H21V16" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M3 16H21" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="7.5" cy="16.5" r="1.6" fill="#fff"/><circle cx="16.5" cy="16.5" r="1.6" fill="#fff"/></svg>
        <span style="font-size:13px;font-weight:600">שאטלים</span>
      </div>
    </a>
    <a href="#" style="text-decoration:none;position:relative;background:linear-gradient(135deg, oklch(0.5 0.09 190), oklch(0.4 0.1 170));border-radius:26px;padding:12px 34px;display:flex;align-items:center;justify-content:center;color:#fff">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="position:absolute;left:14px;top:50%;transform:translateY(-50%)"><path d="M15 5L9 12L15 19" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:13px;font-weight:600;text-align:center">תורניות ושמירות</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><rect x="3" y="5" width="18" height="16" rx="2" stroke="#fff" stroke-width="2"/><path d="M3 9H21" stroke="#fff" stroke-width="2"/><path d="M12 12V16H16" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </a>
  </div>

  <!-- Formats horizontal band -->
  <div style="position:relative;border-radius:14px;overflow:hidden;height:100px">
    <image-slot id="training-photo" shape="rect" placeholder="פורמטים" src="assets/formats-bg.png" style="width:100%;height:100%"></image-slot>
    <div style="position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.55), transparent 60%);pointer-events:none"></div>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;pointer-events:none">
      <span style="font-size:26px;font-weight:600;color:#000">פורמטים</span>
    </div>
  </div>

  <!-- Thin rectangle tiles -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div style="position:relative;border-radius:14px;overflow:hidden;height:64px">
      <img src="assets/bhd-logo.png" style="width:100%;height:100%;object-fit:cover;display:block"/>
      <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45)"></div>
      <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600">דמות הקצין</span>
    </div>

    <div style="position:relative;border-radius:14px;overflow:hidden;height:64px">
      <img src="assets/graph.png" style="width:100%;height:100%;object-fit:cover;display:block"/>
      <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45)"></div>
      <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600">קה"ד 1</span>
    </div>

    <div style="position:relative;border-radius:14px;overflow:hidden;height:64px">
      <img src="assets/campus-logo.png" style="width:100%;height:100%;object-fit:cover;display:block"/>
      <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45)"></div>
      <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600">הקמפוס הדיגיטלי</span>
    </div>

    <div style="position:relative;border-radius:14px;overflow:hidden;height:64px">
      <img src="assets/plane.png" style="width:100%;height:100%;object-fit:cover;display:block"/>
      <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45)"></div>
      <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600">שדה תעופה</span>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      weekDays: [
        { label: 'א', date: 13, today: 'oklch(0.5 0.15 255)', color: '#fff', weight: 700 },
        { label: 'ב', date: 14, today: 'transparent', color: 'oklch(0.35 0.01 260)', weight: 400 },
        { label: 'ג', date: 15, today: 'transparent', color: 'oklch(0.35 0.01 260)', weight: 400 },
        { label: 'ד', date: 16, today: 'transparent', color: 'oklch(0.35 0.01 260)', weight: 400 },
        { label: 'ה', date: 17, today: 'transparent', color: 'oklch(0.35 0.01 260)', weight: 400 },
        { label: 'י', date: 18, today: 'transparent', color: 'oklch(0.35 0.01 260)', weight: 400 },
        { label: 'ש', date: 19, today: 'transparent', color: 'oklch(0.35 0.01 260)', weight: 400 }
      ],
      events: [
        { color: 'oklch(0.55 0.18 255)', start: '08:00', end: '10:00', title: 'אימון בוקר', location: 'מסדר בוקר' },
        { color: 'oklch(0.6 0.15 150)', start: '10:30', end: '12:00', title: 'שיעור מנהיגות', location: 'חדר 3' },
        { color: 'oklch(0.45 0.18 290)', start: '14:00', end: '16:00', title: 'אימון כושר', location: 'מתחם ספורט' }
      ]
    };
  }
}
</script>
</body>
</html>
